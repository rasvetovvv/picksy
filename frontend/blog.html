    <style>

        .blog-bg .blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.22}

        .blog-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);transition:.18s}
        .blog-logo:hover{transform:translateY(-1px)}
        .blog-logo-icon{font-size:1.6rem}
        .blog-logo-text{font-size:1.4rem;font-weight:800}
        .blog-logo-accent{background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .blog-nav{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .blog-nav a{color:var(--text-dim);text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);transition:.2s}
        .blog-nav a:hover{background:var(--glass-deep);color:var(--text);border-color:rgba(167,139,250,.35)}

        .blog-title-main{font-size:clamp(2rem,5vw,3rem);font-weight:900;margin-bottom:14px;background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#f9a8d4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}

    <div class="blog-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

            <a href="/" class="blog-logo">
                <span class="blog-logo-icon">🎬</span>
                <span class="blog-logo-text">Pic<span class="blog-logo-accent">ksy</span></span>
            </a>
            <nav class="blog-nav">
                <a href="/">На головну</a>
                <a href="/quiz">Кіноархетип</a>
                <a href="/wordle">Wordle</a>
            </nav>
        </header>

        <div class="blog-list" id="blog-list-view">
            <section class="blog-hero">
                <span class="blog-hero-eyebrow">Блог Picksy</span>
                <h1 class="blog-title-main">Що подивитися сьогодні?</h1>
                <p class="blog-subtitle">Огляди, добірки і рейтинги фільмів та серіалів від AI-куратора Picksy. Кожна стаття — з посиланнями на сторінки фільмів та свіжими даними TMDB.</p>
                <div class="blog-hero-stats" id="blog-hero-stats"></div>
            </section>

            <div id="blog-active-tag-bar"></div>
            <div id="blog-featured"></div>
            <div class="blog-section-h" id="blog-section-h" style="display:none">
                <h2>Останні статті</h2>

        </div>

            <a class="blog-post-back" id="blog-back-btn">← Назад до блогу</a>

            <div class="blog-post-meta" id="post-meta"></div>
            <div class="blog-post-content" id="post-content"></div>
        </div>

<script>
const API_URL = location.origin;
const SITE = 'https://picksy.my';
const PER_PAGE = 6;
let currentPage = 1;
let currentSlug = null;
let activeTag = null;

async function init() {
    const path = location.pathname;
    const hash = location.hash.replace('#','');
    const matchPath = path.match(/^\/blog\/(.+)$/);
    if (matchPath) {
        currentSlug = matchPath[1];
        await loadPost(currentSlug);
    } else if (hash) {
        currentSlug = hash;
        await loadPost(hash);
    } else {
        await loadPosts(1);
    }
}

function estimateReadTime(p) {
    // Strip HTML tags from content, count words, divide by ~200 wpm.
    const raw = (p.content || p.excerpt || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const words = raw ? raw.split(' ').length : 0;
    const mins = Math.max(1, Math.round(words / 200));
    return mins;
}

// Fallback when a post has no `cover_image`: use the shared Picksy blog OG
// banner instead of a flat emoji placeholder. The image is precached by the
// service worker (STATIC_ASSETS), so this stays fast and works offline too.
const BLOG_FALLBACK_COVER = '/og/default-blog.png';

function contentTypeBadge(ct) {
    const map = {
        movies:  {icon: '🎬', label: 'Фільми',  cls: 'blog-type-movies'},
        tv:      {icon: '📺', label: 'Серіали', cls: 'blog-type-tv'},
        books:   {icon: '📚', label: 'Книги',   cls: 'blog-type-books'},
        mixed:   {icon: '🎭', label: 'Мікс',    cls: 'blog-type-mixed'},
        general: {icon: '📝', label: 'Стаття',  cls: 'blog-type-general'},
    };
    const b = map[ct] || map.general;
    return `<span class="blog-type-chip ${b.cls}">${b.icon} ${b.label}</span>`;
}

function renderFeatured(p) {
    if (!p) return '';
    const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 3);
    const coverSrc = p.cover_image || BLOG_FALLBACK_COVER;
    const ct = p.content_type || 'general';
    return `
        <article class="blog-featured" onclick="navigateToPost('${esc(p.slug)}')">
            <div class="blog-featured-cover">
                <span class="blog-featured-badge">★ Свіже</span>
                <img src="${escH(coverSrc)}" alt="${escH(p.title)}" loading="eager">
            </div>
            <div class="blog-featured-body">
                <div class="blog-featured-tags">
                    ${contentTypeBadge(ct)}
                    ${tags.map(t => `<span class="blog-tag" onclick="event.stopPropagation();loadPosts(1,'${esc(t)}')">${escH(t)}</span>`).join('')}
                    ${p.is_ai_generated ? '<span class="blog-tag ai-tag">🤖 AI</span>' : ''}
                </div>
                <h2 class="blog-featured-title">${escH(p.title)}</h2>
                <p class="blog-featured-excerpt">${escH(p.excerpt || '')}</p>
                <div class="blog-featured-meta">
                    <span>📅 ${formatDate(p.created_at)}</span>
                    <span>⏱ ${estimateReadTime(p)} хв</span>
                    <span>👁 ${p.views || 0}</span>
                </div>
                <a class="blog-featured-cta" href="/blog/${esc(p.slug)}" onclick="event.stopPropagation();navigateToPost('${esc(p.slug)}');return false;">Читати далі →</a>
            </div>
        </article>`;
}

function renderCard(p) {
    const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    const coverSrc = p.cover_image || BLOG_FALLBACK_COVER;
    const ct = p.content_type || 'general';
    return `
        <article class="blog-card" onclick="navigateToPost('${esc(p.slug)}')">
            <div class="blog-card-cover-wrap">
                ${contentTypeBadge(ct)}
                <img class="blog-card-cover" src="${escH(coverSrc)}" alt="${escH(p.title)}" loading="lazy">
            </div>
            <div class="blog-card-body">
                <div class="blog-card-tags">
                    ${tags.slice(0, 3).map(t => `<span class="blog-tag" onclick="event.stopPropagation();loadPosts(1,'${esc(t)}')">${escH(t)}</span>`).join('')}
                    ${p.is_ai_generated ? '<span class="blog-tag ai-tag">🤖 AI</span>' : ''}
                </div>
                <h2 class="blog-card-title">${escH(p.title)}</h2>
                <p class="blog-card-excerpt">${escH(p.excerpt || '')}</p>
                <div class="blog-card-meta">
                    <span>📅 ${formatDate(p.created_at)}</span>
                    <span>👁 ${p.views || 0}</span>
                    <span class="blog-card-readtime">⏱ ${estimateReadTime(p)} хв</span>
                </div>
            </div>
        </article>`;
}

async function loadPosts(page, tag) {
    currentPage = page;
    if (tag !== undefined) activeTag = tag;
    const grid = document.getElementById('blog-grid');
    const featured = document.getElementById('blog-featured');
    const sectionH = document.getElementById('blog-section-h');
    const heroStats = document.getElementById('blog-hero-stats');
    grid.innerHTML = '<div class="blog-loading" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Завантаження…</div>';
    if (featured) featured.innerHTML = '';
    const tagBar = document.getElementById('blog-active-tag-bar');
    tagBar.innerHTML = activeTag
        ? `<div class="blog-active-tag" onclick="loadPosts(1,)">🏷 ${escH(activeTag)} <span style="opacity:.6">✕</span></div>`
        : '';
    try {
        let url = `${API_URL}/api/blog?page=${page}&per_page=${PER_PAGE}`;
        if (activeTag) url += `&tag=${encodeURIComponent(activeTag)}`;
        const res = await fetch(url);
        const data = await res.json();
        const posts = data.posts || [];
        const total = data.total || 0;
        const totalPages = Math.ceil(total / PER_PAGE);

        if (!posts.length) {
            featured.innerHTML = '';
            grid.innerHTML = '<div class="blog-empty" style="grid-column:1/-1"><div class="blog-empty-icon">📝</div>Поки що немає статей. Заходьте пізніше!</div>';
            sectionH.style.display = 'none';
            document.getElementById('blog-pagination').innerHTML = '';
            heroStats.innerHTML = '';
            return;
        }

        // Hero stats: total post count + last-updated marker.
        heroStats.innerHTML = `<span>📚 ${total} ${total === 1 ? 'стаття' : (total < 5 ? 'статті' : 'статей')}</span><span>🆕 Оновлюємо щотижня</span>`;

        // On page 1 with no tag filter: show the latest post as the featured
        // hero card, then the rest as a grid. On filtered/paginated views, just
        // a clean grid (featured would feel weird mid-listing).
        let listToRender = posts;
        if (page === 1 && !activeTag) {
            featured.innerHTML = renderFeatured(posts[0]);
            listToRender = posts.slice(1);
            sectionH.style.display = listToRender.length ? 'flex' : 'none';
        } else {
            sectionH.style.display = 'none';
        }

        grid.innerHTML = listToRender.map(renderCard).join('');

        let pagHtml = '';
        if (totalPages > 1) {
            pagHtml += `<button class="blog-page-btn" onclick="loadPosts(${page - 1},activeTag)" ${page <= 1 ? 'disabled' : ''}>←</button>`;
            for (let i = 1; i <= totalPages; i++) {
                pagHtml += `<button class="blog-page-btn ${i === page ? 'active' : ''}" onclick="loadPosts(${i},activeTag)">${i}</button>`;
            }
            pagHtml += `<button class="blog-page-btn" onclick="loadPosts(${page + 1},activeTag)" ${page >= totalPages ? 'disabled' : ''}>→</button>`;
        }
        document.getElementById('blog-pagination').innerHTML = pagHtml;
    } catch (e) {
        grid.innerHTML = '<div class="blog-empty" style="grid-column:1/-1"><div class="blog-empty-icon">😕</div>Помилка завантаження</div>';
    }
}

async function loadPost(slug) {
    document.getElementById('blog-list-view').classList.add('hidden');
    const postView = document.getElementById('blog-post-view');
    postView.classList.add('active');
    document.getElementById('post-content').innerHTML = '<div class="blog-loading">Завантаження...</div>';
    try {
        const res = await fetch(`${API_URL}/api/blog/${slug}`);
        if (!res.ok) { showList(); return; }
        const p = await res.json();

        document.title = (p.meta_title || p.title) + ' — Picksy Blog';
        updateMeta('description', p.meta_description || p.excerpt || '');
        updateMeta('keywords', p.meta_keywords || p.tags || '');
        updateOGMeta('og:type', 'article');
        updateOGMeta('og:title', p.meta_title || p.title || '');
        updateOGMeta('og:description', p.meta_description || p.excerpt || '');
        updateOGMeta('og:image', p.og_image || p.cover_image || SITE + '/og/default-blog.png');
        updateOGMeta('og:url', SITE + '/blog/' + slug);
        updateOGMeta('twitter:title', p.meta_title || p.title || '');
        updateOGMeta('twitter:description', p.meta_description || p.excerpt || '');
        updateOGMeta('twitter:image', p.og_image || p.cover_image || SITE + '/og/default-blog.png');
        updateCanonical(SITE + '/blog/' + slug);
        injectArticleJsonLd(p);

        document.getElementById('post-title').textContent = p.title;
        document.getElementById('post-meta').innerHTML = `
            <span>📅 ${formatDate(p.created_at)}</span>
            <span>👁 ${p.views || 0} переглядів</span>
            ${p.is_ai_generated ? '<span>🤖 AI-стаття</span>' : ''}
            ${(p.tags || '').split(',').filter(t => t.trim()).map(t => `<span class="blog-tag" style="font-size:.75rem" onclick="showList();loadPosts(1,'${esc(t.trim())}')">${escH(t.trim())}</span>`).join('')}
        `;
        if (p.cover_image) {
            const titleEl = document.getElementById('post-title');
            const img = document.createElement('img');
            img.src = p.cover_image;
            img.alt = p.title;
            img.className = 'blog-post-cover';
            titleEl.parentNode.insertBefore(img, titleEl);
        }
        document.getElementById('post-content').innerHTML = p.content;
    } catch {
        document.getElementById('post-content').innerHTML = '<div class="blog-empty">Статтю не знайдено</div>';
    }
}

function navigateToPost(slug) {
    history.pushState(null, '', `/blog/${slug}`);
    loadPost(slug);
}

function showList() {
    const existingCover = document.querySelector('.blog-post-cover');
    if (existingCover) existingCover.remove();
    document.getElementById('blog-list-view').classList.remove('hidden');
    document.getElementById('blog-post-view').classList.remove('active');
    document.title = 'Блог — Picksy';
    updateMeta('description', 'Блог Picksy — статті про фільми, серіали, книги та AI рекомендації');
    updateOGMeta('og:type', 'website');
    updateCanonical(SITE + '/blog');
    resetBlogJsonLd();
    history.pushState(null, '', '/blog');
    loadPosts(currentPage, activeTag);
}

function updateMeta(name, content) {
    let el = document.querySelector(`meta[name="${name}"]`);
    if (!el) { el = document.createElement('meta'); el.name = name; document.head.appendChild(el); }
    el.content = content;
}

function updateOGMeta(property, content) {
    let el = document.querySelector(`meta[property="${property}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute('property', property); document.head.appendChild(el); }
    el.content = content;
}

function updateCanonical(href) {
    let el = document.getElementById('canonical-url');
    if (!el) { el = document.createElement('link'); el.id = 'canonical-url'; el.rel = 'canonical'; document.head.appendChild(el); }
    el.href = href;
}

function injectArticleJsonLd(p) {
    let el = document.getElementById('blog-jsonld');
    if (!el) { el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'blog-jsonld'; document.head.appendChild(el); }
    el.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": p.title || '',
        "description": p.meta_description || p.excerpt || '',
        "image": p.og_image || p.cover_image || SITE + '/og/default-blog.png',
        "datePublished": (p.created_at || '').slice(0, 10),
        "dateModified": (p.updated_at || p.created_at || '').slice(0, 10),
        "author": { "@type": "Organization", "name": "Picksy" },
        "publisher": {
            "@type": "Organization",
            "name": "Picksy",
            "logo": { "@type": "ImageObject", "url": SITE + "/og-image.png" }
        },
        "mainEntityOfPage": { "@type": "WebPage", "@id": SITE + '/blog/' + (p.slug || '') }
    });
}

function resetBlogJsonLd() {
    let el = document.getElementById('blog-jsonld');
    if (!el) { el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'blog-jsonld'; document.head.appendChild(el); }
    el.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Блог Picksy",
        "description": "Статті про фільми, серіали, книги та AI рекомендації",
        "url": SITE + "/blog",
        "publisher": { "@type": "Organization", "name": "Picksy", "logo": { "@type": "ImageObject", "url": SITE + "/og-image.png" } }
    });
}

document.getElementById('blog-back-btn').addEventListener('click', showList);
window.addEventListener('popstate', () => {
    const m = location.pathname.match(/^\/blog\/(.+)$/);
    if (m) loadPost(m[1]);
    else {
        const existingCover = document.querySelector('.blog-post-cover');
        if (existingCover) existingCover.remove();
        document.getElementById('blog-list-view').classList.remove('hidden');
        document.getElementById('blog-post-view').classList.remove('active');
        loadPosts(currentPage, activeTag);
    }
});

function formatDate(d) { if (!d) return ''; try { return new Date(d).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return String(d).slice(0, 10); } }
function escH(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function esc(s) { return String(s || '').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

init();
</script>
