server {
    listen 80;
    server_name picksy.my;

    # --- Force UTF-8 encoding for all text responses ---
    charset utf-8;
    charset_types text/html text/css text/plain text/xml text/javascript
                  application/javascript application/json application/xml;

    # --- Strict-Transport-Security ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:7888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # --- SSE live stream (no buffering, no gzip, long timeout) ---
    location = /api/live/stream {
        proxy_pass http://127.0.0.1:7888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # --- Cache-Control for static assets (CSS, JS, images, fonts) ---
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:7888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Disable caching for HTML and service worker
    location ~* \.(html)$ {
        proxy_pass http://127.0.0.1:7888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:7888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
